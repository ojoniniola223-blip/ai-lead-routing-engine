<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Automation Project Request</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #1e293b; font-size: 24px; text-align: center; }
        label { display: block; margin: 12px 0 6px; font-weight: 600; color: #475569; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; background-color: #ff6b6b; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #fa5252; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Request Automation Solution</h2>
    <form id="leadForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>

        <label for="email">Business Email</label>
        <input type="email" id="email" placeholder="john@company.com" required>

        <label for="company">Company Name</label>
        <input type="text" id="company" placeholder="Acme Corp" required>

        <label for="budget">Project Budget ($)</label>
        <input type="text" id="budget" placeholder="$5,000" required>

        <label for="message">Project Scope & Details</label>
        <textarea id="message" placeholder="Describe the manual workflows you want to automate..." required></textarea>

        <button type="submit">Submit Request</button>
    </form>
</div>

<script>
    document.getElementById('leadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            company: document.getElementById('company').value,
            budget: document.getElementById('budget').value,
            message: document.getElementById('message').value
        };

        const targetWebhookUrl = "https://olusola141.app.n8n.cloud/webhook/b7881b76-7f00-4918-b6ad-461a2461ee55";

        try {
            const response = await fetch(targetWebhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                alert('Submission successful! Your data has been routed to the AI Engine.');
                document.getElementById('leadForm').reset();
            } else {
                alert('Network response error. Check n8n console logs.');
            }
        } catch (error) {
            alert('Form processing exception error.');
        }
    });
</script>

</body>
</html>
